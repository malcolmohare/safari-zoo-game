<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safari Zoo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦒</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="zoo-screen" class="screen">
    <canvas id="zoo-canvas"></canvas>
    <header id="hud">
      <div class="hud-title">🦒 Safari Zoo</div>
      <div class="hud-stat"><small>Money</small><b id="stat-money">$0</b></div>
      <div class="hud-stat"><small>Day</small><b id="stat-day">1</b></div>
      <div class="hud-stat"><small>Appeal</small><b id="stat-appeal">0</b></div>
      <div class="hud-stat"><small>Visitors</small><b id="stat-visitors">0</b></div>
      <div class="hud-stat"><small>In truck</small><b id="stat-truck">0</b></div>
      <div class="hud-btns">
        <button id="btn-mute" class="icon-btn" data-action="mute" title="Sound on/off">🔊</button>
        <button class="icon-btn" data-action="reset" title="Start a new zoo">♻️</button>
      </div>
    </header>
  </div>

  <div id="safari-screen" class="screen hidden">
    <canvas id="safari-canvas"></canvas>
  </div>

  <div id="modal" class="hidden"><div id="modal-box"></div></div>

  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/safari.js"></script>
  <script src="js/zoo.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
